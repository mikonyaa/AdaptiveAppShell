name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_PROJECT: Examples/AdaptiveShellDemo/AdaptiveShellDemo.xcodeproj
  DEMO_SCHEME: AdaptiveShellDemo
  DEMO_DESTINATION: "generic/platform=iOS Simulator"
  XCODEGEN_VERSION: "2.45.4"
  SWIFTLINT_VERSION: "0.65.0"

jobs:
  fast:
    name: PR · current
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" \
            --output "$RUNNER_TEMP/swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          swift --version
          xcodebuild -version
          test "$(swiftlint version)" = "$SWIFTLINT_VERSION"
      - name: Test package
        run: swift test
      - name: Lint
        run: swiftlint lint --strict
      - name: Build demo
        run: |
          xcodebuild \
            -project "$DEMO_PROJECT" \
            -scheme "$DEMO_SCHEME" \
            -destination "$DEMO_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build separate public consumer
        run: |
          consumer="$RUNNER_TEMP/public-consumer"
          python3 Scripts/prepare_consumer.py "$consumer"
          swift package --package-path "$consumer" resolve
          swift build --package-path "$consumer"

  full:
    name: Full · ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compatibility
            runner: macos-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          - name: current
            runner: macos-26
            developer_dir: /Applications/Xcode_26.5.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" \
            --output "$RUNNER_TEMP/swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          swift --version
          xcodebuild -version
          test "$(swiftlint version)" = "$SWIFTLINT_VERSION"
          test "$(xcodegen --version | awk '{print $2}')" = "$XCODEGEN_VERSION"
      - name: Test package
        run: swift test
      - name: Lint
        run: swiftlint lint --strict
      - name: Build demo
        run: |
          xcodebuild \
            -project "$DEMO_PROJECT" \
            -scheme "$DEMO_SCHEME" \
            -destination "$DEMO_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Hosted demo and public consumer · iPhone
        run: Scripts/run_ui_tests.sh iphone
      - name: Hosted demo and public consumer · iPad
        run: Scripts/run_ui_tests.sh ipad
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-results-${{ matrix.name }}
          path: DerivedData-qa-*/**/results/*.xcresult
          if-no-files-found: warn
      - name: Build released public consumer
        run: |
          consumer="$RUNNER_TEMP/released-consumer"
          python3 Scripts/prepare_consumer.py "$consumer" --version 1.0.3
          swift package --package-path "$consumer" resolve
          swift build --package-path "$consumer"
      - name: Reproduce checked-in project
        if: matrix.name == 'current'
        run: |
          test "$(xcodegen --version | awk '{print $2}')" = "$XCODEGEN_VERSION"
          demo_dir="$(dirname "$DEMO_PROJECT")"
          (
            cd "$demo_dir"
            xcodegen generate
          )
          git diff --exit-code -- "$DEMO_PROJECT/project.pbxproj"
      - name: Check documentation links
        if: matrix.name == 'current'
        run: |
          ruby -e 'Dir["**/*.md"].each { |file| File.read(file).scan(/\[[^\]]*\]\(([^)]+)\)/).flatten.each { |link| next if link.start_with?("http", "#", "mailto:"); path = link.split("#", 2).first.delete_prefix("<").delete_suffix(">"); next if path.empty?; abort("Missing #{path} from #{file}") unless File.exist?(File.expand_path(path, File.dirname(file))) } }'
      - name: Check repository hygiene
        if: matrix.name == 'current'
        run: |
          if git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|xcuserdata|DerivedData|\.build)(/|$)|\.(xcuserstate|xccheckout)$'; then
            exit 1
          fi
