name: Focused proposal
description: Propose a reusable shell improvement with a concrete product need.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the navigation or layout problem before proposing an API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain compact and regular-width behavior, state ownership, and customization points.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Cover Dynamic Type, VoiceOver, contrast, motion, and transparency when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
