name: AdaptiveShellDemo

options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  AdaptiveAppShell:
    path: ../..

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"

targets:
  AdaptiveShellDemo:
    type: application
    platform: iOS
    sources:
      - path: AdaptiveShellDemo
    dependencies:
      - package: AdaptiveAppShell
        product: AdaptiveAppShell
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Adaptive Shell
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.liquidglasstemplates.adaptiveshell
            CFBundleURLSchemes:
              - adaptiveshell
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "1.0.4"
        PRODUCT_BUNDLE_IDENTIFIER: dev.liquidglasstemplates.adaptiveshell.demo
        PRODUCT_NAME: "$(TARGET_NAME)"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  AdaptiveShellDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdaptiveShellDemoTests
    dependencies:
      - target: AdaptiveShellDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.liquidglasstemplates.adaptiveshell.demo.tests
  StudioAdaptationHost:
    type: application
    platform: iOS
    sources:
      - path: AdaptiveShellDemo
        excludes:
          - AdaptiveShellDemoApp.swift
      - path: StudioAdaptationHost
    dependencies:
      - package: AdaptiveAppShell
        product: AdaptiveAppShell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.liquidglasstemplates.adaptiveshell.adaptation
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  StudioAdaptationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StudioAdaptationUITests
    dependencies:
      - target: StudioAdaptationHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.liquidglasstemplates.adaptiveshell.adaptation.uitests
  AdaptiveShellDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AdaptiveShellDemoUITests
    dependencies:
      - target: AdaptiveShellDemo
      - target: StudioAdaptationHost
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.liquidglasstemplates.adaptiveshell.demo.uitests
        TEST_TARGET_NAME: AdaptiveShellDemo

schemes:
  AdaptiveShellDemo:
    build:
      targets:
        AdaptiveShellDemo: all
        StudioAdaptationHost: [test]
    test:
      gatherCoverageData: true
      targets:
        - AdaptiveShellDemoTests
        - AdaptiveShellDemoUITests
        - StudioAdaptationUITests
